services:
  - type: web
    name: used-battery-recycling-briefing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "21600"
      - key: NEWS_LOOKBACK_MONTHS
        value: "6"
      - key: ENABLE_ALPHA
        value: "false"
