services:
  - type: web
    name: battery-trend-briefing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: CACHE_TTL_SECONDS
        value: "21600"
      - key: PYTHON_VERSION
        value: 3.13.5
